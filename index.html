<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Template Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f11; --surface: #18181c; --surface2: #222228;
    --border: #2e2e38; --accent: #6c63ff; --accent2: #a78bfa;
    --text: #e8e8f0; --text2: #c8c8d8; --text3: #9090a8;
    --success: #34d399; --danger: #f87171; --warn: #fbbf24;
    --mono: 'JetBrains Mono', monospace; --sans: 'DM Sans', sans-serif; --radius: 8px;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); flex-shrink: 0; }
  header .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #fff; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 500; }
  header span { font-size: 13px; color: var(--text3); margin-left: auto; }

  .workspace { display: grid; grid-template-columns: 1fr 280px 1fr; flex: 1; overflow: hidden; min-height: 0; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; min-height: 0; }
  .panel:last-child { border-right: none; }
  .panel-header { padding: 8px 14px; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .panel-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .panel-body { flex: 1; overflow-y: auto; padding: 14px; min-height: 0; }

  textarea#template { width: 100%; height: 100%; background: var(--bg); border: none; outline: none; color: var(--text); font-family: var(--mono); font-size: 12px; line-height: 1.7; resize: none; caret-color: var(--accent2); padding: 14px; display: block; }
  textarea#template::placeholder { color: var(--text3); }

  .var-list { display: flex; flex-direction: column; gap: 12px; }
  .var-item label { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-family: var(--mono); letter-spacing: 0.03em; font-weight: 500; }
  .var-item label .desc { font-size: 10px; color: var(--text3); font-weight: 400; }
  .var-btn-group { display: flex; gap: 6px; }
  .var-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text2); font-size: 13px; font-family: var(--mono); cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .var-btn:hover { border-color: var(--accent); color: var(--text); }
  .var-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .var-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); font-size: 13px; font-family: var(--mono); outline: none; transition: border-color 0.15s; }
  .var-input:focus { border-color: var(--accent); }
  .empty-vars { color: var(--text3); font-size: 13px; text-align: center; padding: 2rem 1rem; line-height: 1.6; }
  .unknown-vars { margin-top: 16px; padding: 10px 12px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.3); border-radius: var(--radius); }
  .unknown-vars .title { font-size: 11px; color: var(--danger); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .unknown-var-item { font-size: 12px; font-family: var(--mono); color: var(--danger); padding: 2px 0; }

  /* Right panel: meta on top, email below */
  .preview-panel { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

  .meta-block { flex-shrink: 0; border-bottom: 1px solid var(--border); overflow-y: auto; max-height: 42%; }
  .meta-rows { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .meta-row { display: flex; flex-direction: column; gap: 3px; }
  .meta-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 500; }
  .meta-value { font-size: 13px; color: var(--text2); font-family: var(--mono); word-break: break-all; }
  .meta-value.name { font-size: 14px; color: var(--text); font-weight: 600; font-family: var(--sans); }
  .meta-value.note { color: var(--text3); font-style: italic; font-family: var(--sans); }
  .meta-value.prose { font-family: var(--sans); line-height: 1.6; color: var(--text2); }

  .email-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  iframe#preview-frame { width: 100%; height: 100%; border: none; background: #fff; flex: 1; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>Mail Template Preview</h1>
  <span>client-side only · no data sent anywhere</span>
</header>

<div class="workspace">
  <!-- LEFT: Template -->
  <div class="panel">
    <div class="panel-header"><div class="dot"></div>Template</div>
    <div class="panel-body" style="padding:0;display:flex;flex-direction:column;min-height:0;">
      <textarea id="template" placeholder="Paste your mail template here..."></textarea>
    </div>
  </div>

  <!-- MIDDLE: Variables -->
  <div class="panel">
    <div class="panel-header"><div class="dot" style="background:var(--success)"></div>Variables</div>
    <div class="panel-body">
      <div class="var-list" id="var-list">
        <div class="empty-vars">Paste a template<br>to see variables</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Setup + Email preview -->
  <div class="panel preview-panel">

    <div class="meta-block" id="meta-block" style="display:none;">
      <div class="panel-header" style="border-bottom:1px solid var(--border);">
        <div class="dot" style="background:var(--warn)"></div>Template Setup
      </div>
      <div class="meta-rows">
        <div class="meta-row">
          <div class="meta-label">Template Name</div>
          <div class="meta-value name" id="meta-name"></div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Sender Email</div>
          <div class="meta-value" id="meta-sender"></div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Internal Note</div>
          <div class="meta-value note" id="meta-note"></div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Email Subject</div>
          <div class="meta-value prose" id="meta-subject"></div>
        </div>
        <div class="meta-row">
          <div class="meta-label">Internal Text</div>
          <div class="meta-value prose" id="meta-internal"></div>
        </div>
      </div>
    </div>

    <div class="email-wrap">
      <div class="panel-header">
        <div class="dot" style="background:var(--accent2)"></div>Email Preview
      </div>
      <iframe id="preview-frame" sandbox="allow-same-origin"></iframe>
    </div>

  </div>
</div>

<script src="variables.js"></script>
<script>
  const templateEl = document.getElementById('template');
  const varList    = document.getElementById('var-list');
  const frame      = document.getElementById('preview-frame');
  const metaBlock  = document.getElementById('meta-block');
  let vars = {};

  const VAR_LOOKUP = {};
  VARIABLE_DEFINITIONS.forEach(v => { VAR_LOOKUP[v.name] = v; });

  // ─── TOKENIZER ───────────────────────────────────────────────────────────────
  function tokenize(src) {
    const tokens = [];
    let i = 0;
    while (i < src.length) {
      const start = src.indexOf('{{', i);
      if (start === -1) { tokens.push({ type: 'text', value: src.slice(i) }); break; }
      if (start > i) tokens.push({ type: 'text', value: src.slice(i, start) });
      let depth = 1, j = start + 2;
      while (j < src.length && depth > 0) {
        if (src[j] === '{' && src[j+1] === '{') { depth++; j += 2; }
        else if (src[j] === '}' && src[j+1] === '}') { depth--; j += 2; }
        else j++;
      }
      tokens.push({ type: 'tag', value: src.slice(start + 2, j - 2) });
      i = j;
    }
    return tokens;
  }

  // ─── SPLIT ON | RESPECTING NESTING AND HTML QUOTES ───────────────────────────
  function splitParts(inner) {
    const parts = [];
    let current = '', depth = 0, i = 0, inQuote = null;
    while (i < inner.length) {
      const ch = inner[i];
      if (depth === 0 && !inQuote && (ch === '"' || ch === "'")) { inQuote = ch; current += ch; i++; continue; }
      if (depth === 0 && inQuote && ch === inQuote)               { inQuote = null; current += ch; i++; continue; }
      if (inQuote)                                                 { current += ch; i++; continue; }
      if (ch === '{' && inner[i+1] === '{') { depth++; current += '{{'; i += 2; continue; }
      if (ch === '}' && inner[i+1] === '}') { depth--; current += '}}'; i += 2; continue; }
      if (ch === '|' && depth === 0)        { parts.push(current); current = ''; i++; continue; }
      current += ch; i++;
    }
    parts.push(current);
    return parts;
  }

  // ─── DECODE MAIL ENGINE ESCAPING ─────────────────────────────────────────────
  function decodeMail(src) {
    src = src.replace(/'?\|\|'&'\|\|'([a-zA-Z0-9#]+);/g, '&$1;');
    src = src.replace(/''/g, "'");
    return src;
  }

  // ─── EVALUATE CONDITION ──────────────────────────────────────────────────────
  function evalCondition(actual, op, type, matchVal) {
    const a = type === 'NUMBER' ? parseFloat(actual) : actual.trim();
    const b = type === 'NUMBER' ? parseFloat(matchVal) : matchVal.trim();
    switch(op) {
      case '=':  return a == b;  case '!=': return a != b;
      case '>':  return a > b;   case '<':  return a < b;
      case '>=': return a >= b;  case '<=': return a <= b;
      default:   return false;
    }
  }

  // ─── UNKNOWN VAR SPAN HELPERS ────────────────────────────────────────────────
  function redSpan(label)    { return `<span style="background:#7f1d1d;color:#fca5a5;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:11px;">${label}</span>`; }
  function yellowSpan(label) { return `<span style="background:#78350f;color:#fcd34d;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:11px;">${label}</span>`; }

  // ─── MAIN RECURSIVE EVALUATOR ────────────────────────────────────────────────
  // mode 'html' → coloured spans for unknowns; 'text' → plain {{VAR}}
  function evaluate(src, values, unknowns, mode) {
    mode = mode || 'html';
    const tokens = tokenize(src);
    let result = '';

    for (const token of tokens) {
      if (token.type === 'text') { result += token.value; continue; }

      const parts = splitParts(token.value);
      const cmd   = parts[0].trim();

      // ── IF ──────────────────────────────────────────────────────────────────
      if (cmd === 'IF' && parts[1] === 'ARG') {
        const varName  = parts[2];
        const op       = parts[3];
        const type     = parts[4];
        const matchVal = parts[5];
        const trueVal  = parts[7] || '';
        const falseVal = parts[9] || '';
        const actual   = values[varName] !== undefined ? String(values[varName]) : '';
        const branch   = evalCondition(actual, op, type, matchVal) ? trueVal : falseVal;
        result += evaluate(branch, values, unknowns, mode);
        continue;
      }

      // ── ARG fallback chain ───────────────────────────────────────────────────
      if (cmd === 'ARG') {
        let resolved = null;
        const allNames = [];
        for (let k = 0; k + 1 < parts.length; k += 2) {
          if (parts[k].trim() === 'ARG') {
            const name = parts[k+1].trim();
            allNames.push(name);
            if (!VAR_LOOKUP[name]) unknowns.add(name);
            if (resolved === null && values[name] !== undefined && values[name] !== '') resolved = values[name];
          }
        }
        if (resolved !== null) { result += resolved; continue; }
        const label = `{{ARG|${allNames[0] || '?'}}}`;
        const isKnown = allNames.some(n => VAR_LOOKUP[n]);
        if (mode === 'html') result += isKnown ? yellowSpan(label) : redSpan(label);
        else                 result += label;
        continue;
      }

      // ── Simple {{VARNAME}} ───────────────────────────────────────────────────
      const name = cmd;
      if (['ARG','IF','TEXT','NUMBER'].includes(name)) continue;
      if (values[name] !== undefined && values[name] !== '') { result += values[name]; continue; }
      if (!VAR_LOOKUP[name]) unknowns.add(name);
      const label2 = `{{${name}}}`;
      if (mode === 'html') result += VAR_LOOKUP[name] ? yellowSpan(label2) : redSpan(label2);
      else                 result += label2;
    }
    return result;
  }

  // ─── PARSE do_template_setup ARGUMENTS ───────────────────────────────────────
  // Extracts single-quoted string args, correctly handling:
  //   ''   -> escaped single quote inside string
  //   '||' -> Oracle string concatenation (joins segments, not end of string)
  function extractSetupArgs(src) {
    const triggerMatch = src.match(/--\s*Make\s+template\s+setup/i);
    if (!triggerMatch) return null;

    const afterTrigger = src.slice(triggerMatch.index);
    const callMatch = afterTrigger.match(/do_template_setup\s*\(/i);
    if (!callMatch) return null;

    let pos = afterTrigger.indexOf('(', callMatch.index) + 1;
    const args = [];

    while (pos < afterTrigger.length && args.length < 7) {
      // Skip whitespace and commas between args
      while (pos < afterTrigger.length && /[\s,]/.test(afterTrigger[pos])) pos++;
      if (pos >= afterTrigger.length) break;

      if (afterTrigger[pos] === "'") {
        pos++; // skip opening quote
        let val = '';
        while (pos < afterTrigger.length) {
          const ch = afterTrigger[pos];
          if (ch === "'" && afterTrigger[pos+1] === "'") {
            // Escaped quote: '' -> '
            val += "'"; pos += 2;
          } else if (ch === "'" && afterTrigger[pos+1] === '|' && afterTrigger[pos+2] === '|') {
            // Oracle concatenation: 'text'||'more' - skip closing quote and ||
            pos++; // skip quote
            while (pos < afterTrigger.length && afterTrigger[pos] === '|') pos++; // skip ||
            if (afterTrigger[pos] === "'") pos++; // skip next opening quote
          } else if (ch === "'") {
            pos++; break; // real end of string
          } else {
            val += ch; pos++;
          }
        }
        args.push(val);
      } else {
        // Skip unquoted token
        while (pos < afterTrigger.length && afterTrigger[pos] !== ',' && afterTrigger[pos] !== ')') pos++;
      }
    }

    return {
      code:         args[0] || '',
      name:         args[1] || '',
      senderRaw:    args[2] || '',
      internalNote: args[3] || '',
      subjectRaw:   args[4] || '',
      internalText: args[5] || '',
      htmlBody:     args[6] || '',
    };
  }

  // ─── EXTRACT ALL VAR NAMES FROM RAW SOURCE ───────────────────────────────────
  function extractAllVarNames(src) {
    const found = new Set();
    const re  = /\{\{(?:IF\|ARG\||ARG\|)([A-Z0-9_]+)/g;
    const re2 = /\{\{([A-Z0-9_]+)\}\}/g;
    let m;
    while ((m = re.exec(src))  !== null) found.add(m[1]);
    while ((m = re2.exec(src)) !== null) {
      if (!['ARG','IF','TEXT','NUMBER'].includes(m[1])) found.add(m[1]);
    }
    return found;
  }

  // ─── FONT LOADER ─────────────────────────────────────────────────────────────
  const loadedFonts = new Set();
  function ensureFonts(html) {
    ['Quicksand','Roboto','Open Sans','Lato','Montserrat','Oswald','Raleway','Nunito','Poppins'].forEach(font => {
      if (!html.includes(font) || loadedFonts.has(font)) return;
      const href = 'https://fonts.googleapis.com/css2?family=' + font.replace(/ /g,'+') + ':wght@400;500;600&display=swap';
      [document, frame.contentDocument].forEach(doc => {
        if (!doc) return;
        const l = doc.createElement('link'); l.rel = 'stylesheet'; l.href = href;
        doc.head.appendChild(l);
      });
      loadedFonts.add(font);
    });
  }

  // ─── RENDER VARIABLES PANEL ──────────────────────────────────────────────────
  function renderVars(allVarNames) {
    const known   = [...allVarNames].filter(n => VAR_LOOKUP[n]);
    const unknown = [...allVarNames].filter(n => !VAR_LOOKUP[n]);

    const newVars = {};
    known.forEach(n => { newVars[n] = vars[n] !== undefined ? vars[n] : (VAR_LOOKUP[n].type === 'toggle' ? '0' : ''); });
    vars = newVars;

    varList.innerHTML = '';
    if (known.length === 0 && unknown.length === 0) {
      varList.innerHTML = '<div class="empty-vars">No variables found<br>in template</div>';
      return;
    }

    known.forEach(name => {
      const def  = VAR_LOOKUP[name];
      const item = document.createElement('div');
      item.className = 'var-item';
      const lbl = `<label>${name} <span class="desc">${def.description}</span></label>`;

      if (def.type === 'toggle') {
        item.innerHTML = lbl + `<div class="var-btn-group">
          <button class="var-btn ${vars[name]==='1'?'active':''}" data-var="${name}" data-val="1">1</button>
          <button class="var-btn ${vars[name]!=='1'?'active':''}" data-var="${name}" data-val="0">Other</button>
        </div>`;
        item.querySelectorAll('.var-btn').forEach(btn => btn.addEventListener('click', e => {
          vars[name] = e.target.dataset.val;
          item.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          update(false);
        }));
      } else if (def.type === 'number') {
        item.innerHTML = lbl + `<input class="var-input" type="number" step="1" data-var="${name}" value="${vars[name]}" placeholder="0">`;
        item.querySelector('input').addEventListener('input', e => { vars[name] = e.target.value; update(false); });
      } else {
        item.innerHTML = lbl + `<input class="var-input" type="text" data-var="${name}" value="${vars[name]}" placeholder="value...">`;
        item.querySelector('input').addEventListener('input', e => { vars[name] = e.target.value; update(false); });
      }
      varList.appendChild(item);
    });

    if (unknown.length > 0) {
      const box = document.createElement('div');
      box.className = 'unknown-vars';
      box.innerHTML = `<div class="title">⚠ Not in variable list</div>` +
        unknown.map(n => `<div class="unknown-var-item">{{${n}}}</div>`).join('');
      varList.appendChild(box);
    }
  }

  // ─── RENDER META PANEL ───────────────────────────────────────────────────────
  function renderMeta(setup, unknowns) {
    if (!setup || !setup.name) { metaBlock.style.display = 'none'; return; }
    metaBlock.style.display = 'block';

    document.getElementById('meta-name').textContent =
      (setup.name || '') + (setup.code ? '  [' + setup.code + ']' : '');

    // Sender: senderRaw is already a full {{ARG|...|ARG|...}} expression
    document.getElementById('meta-sender').innerHTML =
      evaluate(decodeMail(setup.senderRaw), vars, unknowns, 'html');

    document.getElementById('meta-note').textContent = setup.internalNote;

    document.getElementById('meta-subject').innerHTML =
      evaluate(decodeMail(setup.subjectRaw), vars, unknowns, 'html');

    document.getElementById('meta-internal').innerHTML =
      evaluate(decodeMail(setup.internalText), vars, unknowns, 'html');
  }

  // ─── RENDER EMAIL PREVIEW ────────────────────────────────────────────────────
  function renderPreview(html, unknowns) {
    const body = html.trim() ||
      '<p style="color:#aaa;font-style:italic;padding:20px;font-family:Arial">Preview will appear here...</p>';
    const decoded  = decodeMail(body);
    const rendered = html.trim() ? evaluate(decoded, vars, unknowns, 'html') : body;
    ensureFonts(rendered);
    frame.contentDocument.open();
    frame.contentDocument.write(rendered);
    frame.contentDocument.close();
  }

  // ─── MAIN UPDATE ─────────────────────────────────────────────────────────────
  function update(rebuildVars) {
    const raw    = templateEl.value;
    const setup  = extractSetupArgs(raw);
    // HTML body: prefer parsed arg[6], else fall back to splitting on '<!DOCTYPE
    let htmlBody = '';
    if (setup && setup.htmlBody) {
      htmlBody = setup.htmlBody;
    } else {
      const idx = raw.indexOf('<!DOCTYPE');
      if (idx !== -1) {
        // Strip trailing '); if present
        htmlBody = raw.slice(idx).replace(/'\s*\)\s*;?\s*$/, '').trim();
      } else {
        htmlBody = raw;
      }
    }

    const allVarNames = extractAllVarNames(raw);
    if (rebuildVars) renderVars(allVarNames);

    const unknowns = new Set();
    renderMeta(setup, unknowns);
    renderPreview(htmlBody, unknowns);
  }

  // Init iframe
  frame.contentDocument.open();
  frame.contentDocument.write('<p style="color:#aaa;font-style:italic;padding:20px;font-family:Arial">Preview will appear here...</p>');
  frame.contentDocument.close();

  templateEl.addEventListener('input', () => update(true));
</script>
</body>
</html>
