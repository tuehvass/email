<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Template Preview</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f11; --surface: #18181c; --surface2: #222228;
    --border: #2e2e38; --accent: #6c63ff; --accent2: #a78bfa;
    --text: #e8e8f0; --text2: #9090a8; --text3: #5a5a70;
    --success: #34d399; --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif; --radius: 8px;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
  header .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #fff; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 500; }
  header span { font-size: 13px; color: var(--text3); margin-left: auto; }
  .workspace { display: grid; grid-template-columns: 1fr 280px 1fr; flex: 1; height: calc(100vh - 53px); overflow: hidden; }
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
  .panel:last-child { border-right: none; }
  .panel-header { padding: 10px 14px; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 8px; }
  .panel-header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .panel-body { flex: 1; overflow-y: auto; padding: 14px; }
  textarea#template { width: 100%; height: 100%; background: transparent; border: none; outline: none; color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.7; resize: none; caret-color: var(--accent2); }
  textarea#template::placeholder { color: var(--text3); }
  .var-list { display: flex; flex-direction: column; gap: 12px; }
  .var-item label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 5px; font-family: var(--mono); letter-spacing: 0.04em; }
  .var-btn-group { display: flex; gap: 6px; }
  .var-btn { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text2); font-size: 13px; font-family: var(--mono); cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .var-btn:hover { border-color: var(--accent); color: var(--text); }
  .var-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .var-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); font-size: 13px; font-family: var(--mono); outline: none; transition: border-color 0.15s; }
  .var-input:focus { border-color: var(--accent); }
  .empty-vars { color: var(--text3); font-size: 13px; text-align: center; padding: 2rem 1rem; line-height: 1.6; }
  .preview-body { padding: 20px; overflow-y: auto; flex: 1; }
  #preview-output { background: #fff; color: #222; border-radius: var(--radius); padding: 24px; min-height: 100px; font-family: Arial, sans-serif; font-size: 14px; line-height: 1.7; }
  #preview-output h1 { font-size: 22px; margin-bottom: 10px; }
  #preview-output h2 { font-size: 18px; margin-bottom: 8px; }
  #preview-output p { margin-bottom: 8px; }
  .empty-preview { color: #aaa; font-size: 13px; font-style: italic; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<header>
  <div class="logo">M</div>
  <h1>Mail Template Preview</h1>
  <span>client-side only · no data sent anywhere</span>
</header>
<div class="workspace">
  <div class="panel">
    <div class="panel-header"><div class="dot"></div>Template</div>
    <div class="panel-body" style="padding:0; display:flex; flex-direction:column;">
      <textarea id="template" placeholder="Paste your mail template here..."></textarea>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header"><div class="dot" style="background:var(--success)"></div>Variables</div>
    <div class="panel-body">
      <div class="var-list" id="var-list">
        <div class="empty-vars">Paste a template<br>to see variables</div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header"><div class="dot" style="background:var(--accent2)"></div>Preview</div>
    <div class="preview-body">
      <div id="preview-output"><span class="empty-preview">Preview will appear here...</span></div>
    </div>
  </div>
</div>
<script>
  const templateEl = document.getElementById('template');
  const varList    = document.getElementById('var-list');
  const preview    = document.getElementById('preview-output');
  let vars = {};
  let varMeta = {};

  // Detect all variables and their types from the template
  function analyseTemplate(tpl) {
    const meta = {};

    // IF conditions: {{IF|ARG|VARNAME|OP|TYPE|VAL|...}}
    const ifRe = /\{\{IF\|ARG\|([A-Z0-9_]+)\|([!=<>]+)\|(NUMBER|TEXT)\|([^|]*)/g;
    let m;
    while ((m = ifRe.exec(tpl)) !== null) {
      const name = m[1], op = m[2], type = m[3], val = m[4].trim();
      if (!meta[name]) meta[name] = { type: 'unknown', ops: [] };
      meta[name].ops.push({ op, type, val });
      // If compared as NUMBER -> number input
      if (type === 'NUMBER') meta[name].type = 'number';
      // If compared as TEXT with = and val is 1 -> toggle
      else if (type === 'TEXT' && op === '=' && val === '1' && meta[name].type !== 'number') meta[name].type = 'toggle';
      else if (meta[name].type === 'unknown') meta[name].type = 'text';
    }

    // Inline args: {{ARG|VARNAME}} or {{VARNAME}}
    const argRe = /\{\{ARG\|([A-Z0-9_]+)\}\}/g;
    while ((m = argRe.exec(tpl)) !== null) {
      if (!meta[m[1]]) meta[m[1]] = { type: 'text', ops: [] };
    }
    const simpleRe = /\{\{([A-Z0-9_]+)\}\}/g;
    while ((m = simpleRe.exec(tpl)) !== null) {
      if (!meta[m[1]]) meta[m[1]] = { type: 'text', ops: [] };
    }

    return meta;
  }

  // Evaluate a condition
  function evalCondition(actual, op, type, matchVal) {
    const a = type === 'NUMBER' ? parseFloat(actual) : actual.trim();
    const b = type === 'NUMBER' ? parseFloat(matchVal) : matchVal.trim();
    switch (op) {
      case '=':  return a == b;
      case '!=': return a != b;
      case '>':  return a > b;
      case '<':  return a < b;
      case '>=': return a >= b;
      case '<=': return a <= b;
      default:   return false;
    }
  }

  // Parse one level of IF — handles nested by recursing
  function parseOnce(tpl, values) {
    // Replace ''  with ' (mail engine escaping)
    tpl = tpl.replace(/''/g, "'");

    // Replace {{ARG|VAR}} inline
    tpl = tpl.replace(/\{\{ARG\|([A-Z0-9_]+)\}\}/g, (_, name) => values[name] !== undefined ? values[name] : '');

    // Replace {{VAR}} simple substitution
    tpl = tpl.replace(/\{\{([A-Z0-9_]+)\}\}/g, (_, name) => values[name] !== undefined ? values[name] : `<span style="color:#e74c3c">{{${name}}}</span>`);

    return tpl;
  }

  // Recursively resolve nested IF statements
  function resolveIFs(tpl, values) {
    // Keep resolving until no more IF tags remain (handles nesting)
    let prev = null;
    let iterations = 0;
    while (prev !== tpl && iterations < 20) {
      prev = tpl;
      tpl = tpl.replace(
        /\{\{IF\|ARG\|([A-Z0-9_]+)\|([!=<>]+)\|(NUMBER|TEXT)\|([^|]*)\|TEXT\|([^|]*)\|TEXT\|([^}]*)\}\}/g,
        (_, varName, op, type, matchVal, trueVal, falseVal) => {
          const actual = values[varName] !== undefined ? String(values[varName]) : '';
          matchVal = matchVal.replace(/''/g, "'");
          trueVal  = trueVal.replace(/''/g, "'");
          falseVal = falseVal.replace(/''/g, "'");
          return evalCondition(actual, op, type, matchVal) ? trueVal : falseVal;
        }
      );
      iterations++;
    }
    return tpl;
  }

  function parseTemplate(tpl, values) {
    tpl = resolveIFs(tpl, values);
    tpl = parseOnce(tpl, values);
    return tpl;
  }

  // Load Google Fonts found in rendered output
  const loadedFonts = new Set();
  function ensureFonts(html) {
    ['Quicksand','Roboto','Open Sans','Lato','Montserrat','Oswald','Raleway','Nunito','Poppins'].forEach(font => {
      if (html.includes(font) && !loadedFonts.has(font)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + font.replace(/ /g, '+') + ':wght@400;500;600&display=swap';
        document.head.appendChild(link);
        loadedFonts.add(font);
      }
    });
  }

  function renderVars(meta) {
    const names = Object.keys(meta);
    if (names.length === 0) {
      varList.innerHTML = '<div class="empty-vars">No variables found<br>in template</div>';
      return;
    }

    // Preserve existing values
    const newVars = {};
    names.forEach(n => {
      newVars[n] = vars[n] !== undefined ? vars[n] : (meta[n].type === 'toggle' ? '0' : '');
    });
    vars = newVars;
    varMeta = meta;

    varList.innerHTML = '';
    names.forEach(name => {
      const t = meta[name].type;
      const item = document.createElement('div');
      item.className = 'var-item';

      if (t === 'toggle') {
        item.innerHTML = `
          <label>${name}</label>
          <div class="var-btn-group">
            <button class="var-btn ${vars[name] === '1' ? 'active' : ''}" data-var="${name}" data-val="1">1</button>
            <button class="var-btn ${vars[name] !== '1' ? 'active' : ''}" data-var="${name}" data-val="0">Other</button>
          </div>`;
        item.querySelectorAll('.var-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            vars[name] = e.target.dataset.val;
            item.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderPreview();
          });
        });
      } else if (t === 'number') {
        item.innerHTML = `<label>${name}</label><input class="var-input" type="number" step="1" data-var="${name}" value="${vars[name]}" placeholder="0">`;
        item.querySelector('input').addEventListener('input', e => {
          vars[name] = e.target.value;
          renderPreview();
        });
      } else {
        item.innerHTML = `<label>${name}</label><input class="var-input" type="text" data-var="${name}" value="${vars[name]}" placeholder="value...">`;
        item.querySelector('input').addEventListener('input', e => {
          vars[name] = e.target.value;
          renderPreview();
        });
      }
      varList.appendChild(item);
    });
  }

  function renderPreview() {
    const tpl = templateEl.value.trim();
    if (!tpl) { preview.innerHTML = '<span class="empty-preview">Preview will appear here...</span>'; return; }
    const rendered = parseTemplate(tpl, vars);
    ensureFonts(rendered);
    preview.innerHTML = rendered;
  }

  function update() {
    const tpl = templateEl.value;
    const meta = analyseTemplate(tpl);
    renderVars(meta);
    renderPreview();
  }

  templateEl.addEventListener('input', update);
</script>
</body>
</html>
